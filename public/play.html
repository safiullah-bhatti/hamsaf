<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Quiz</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { width: 100%; max-width: 420px; background: #16213e; border-radius: 16px; padding: 28px; }
  h1 { margin-top: 0; text-align: center; }
  label { display: block; margin: 14px 0 4px; font-size: 14px; opacity: .8; }
  input { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 20px; text-align: center; }
  button { margin-top: 22px; width: 100%; padding: 16px; border: none; border-radius: 10px;
           background: #e94560; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
  .err { color: #ffb4b4; margin-top: 10px; text-align: center; }
  .question { font-size: 22px; font-weight: 700; margin-bottom: 18px; text-align: center; }
  #timer { text-align: center; font-size: 18px; color: #ffd166; margin-bottom: 10px; }
  .options { display: grid; gap: 12px; }
  .opt-btn { padding: 18px; border-radius: 10px; border: none; color: #fff;
             font-size: 18px; font-weight: 600; cursor: pointer; }
  .opt-btn.selected { outline: 4px solid #fff; }
  .opt-btn.disabled { opacity: .5; pointer-events: none; }
  .opt-0 { background: #e63946; } /* red */
  .opt-1 { background: #3a86ff; } /* blue */
  .opt-2 { background: #ffb703; } /* yellow */
  .opt-3 { background: #2a9d8f; } /* green */
  .opt-yes { background: #2a9d8f; } /* green */
  .opt-no  { background: #e63946; } /* red */
  .waiting { text-align: center; font-size: 20px; margin-top: 40px; }
  .feedback { text-align: center; font-size: 24px; margin-top: 30px; }
  .score { text-align: center; font-size: 16px; opacity: .8; margin-top: 8px; }
  .hidden { display: none; }
  .lb li { display: flex; justify-content: space-between; background: #0f3460; padding: 10px 14px;
           border-radius: 8px; margin-bottom: 6px; list-style: none; }
  .winner { font-size: 22px; margin: 6px 0; text-align: center; }
</style>
</head>
<body>

<div class="card" id="joinView">
  <h1>🎮 Join Quiz</h1>
  <label>Game Code</label>
  <input id="gameId" inputmode="numeric" maxlength="5" placeholder="12345" />
  <label>Nickname</label>
  <input id="nickname" maxlength="20" placeholder="Your name" />
  <button id="joinBtn">Join</button>
  <div class="err" id="joinErr"></div>
</div>

<div class="card hidden" id="waitView">
  <div class="waiting" id="waitingText">You're in! Waiting for the host to start...</div>
</div>

<div class="card hidden" id="questionView">
  <div id="timer"></div>
  <div class="question" id="questionText"></div>
  <div class="options" id="optionsList"></div>
  <div id="multiSubmitWrap" class="hidden">
    <button id="submitMultiBtn">Submit Answer</button>
  </div>
  <div id="textAnswerWrap" class="hidden">
    <input id="textAnswer" placeholder="Type your answer" />
    <button id="submitTextBtn">Submit</button>
  </div>
</div>

<div class="card hidden" id="feedbackView">
  <div class="feedback" id="feedbackText"></div>
  <div class="score" id="scoreText"></div>
</div>

<div class="card hidden" id="endView">
  <h1 id="endTitle">Game Over</h1>
  <div id="winnersList"></div>
  <ul class="lb" id="finalLbList"></ul>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myGameId = null;
  let currentQuestion = null;
  let selected = [];

  // If opened via the QR code (?game=12345), pre-fill the code and jump straight
  // to the nickname field so kids only have to type their name.
  const params = new URLSearchParams(location.search);
  const prefillGame = params.get('game');
  if (prefillGame) {
    document.getElementById('gameId').value = prefillGame;
    document.getElementById('nickname').focus();
  }

  document.getElementById('joinBtn').onclick = () => {
    const gid = document.getElementById('gameId').value.trim();
    const nick = document.getElementById('nickname').value.trim();
    if (!gid || !nick) { setErr('Enter both game code and nickname'); return; }
    myGameId = gid;
    socket.emit('player-join', { gameId: gid, nickname: nick });
  };

  socket.on('join-error', (msg) => setErr(msg));

  socket.on('joined', () => {
    show('waitView');
  });

  socket.on('game-started', () => {
    document.getElementById('waitingText').textContent = 'Game starting...';
  });

  socket.on('question', (q) => {
    currentQuestion = q;
    selected = [];
    show('questionView');
    document.getElementById('questionText').textContent = q.question;
    startTimer(q.seconds);

    const optsWrap = document.getElementById('optionsList');
    const textWrap = document.getElementById('textAnswerWrap');
    const multiWrap = document.getElementById('multiSubmitWrap');

    // Reset controls fresh for this question — this is what was missing before,
    // which is why the text/multi submit buttons stayed disabled after question 1.
    textWrap.classList.add('hidden');
    multiWrap.classList.add('hidden');
    document.getElementById('submitTextBtn').disabled = false;
    document.getElementById('submitMultiBtn').disabled = false;

    if (q.type === 'text') {
      optsWrap.innerHTML = '';
      textWrap.classList.remove('hidden');
      document.getElementById('textAnswer').value = '';
      document.getElementById('textAnswer').focus();
    } else {
      optsWrap.innerHTML = q.options.map((o, i) => {
        const colorClass = q.type === 'yesno' ? (i === 0 ? 'opt-yes' : 'opt-no') : `opt-${i}`;
        return `<button class="opt-btn ${colorClass}" data-i="${i}">${escapeHtml(o)}</button>`;
      }).join('');
      [...optsWrap.querySelectorAll('.opt-btn')].forEach(btn => {
        btn.onclick = () => handleOptionClick(btn, q.type);
      });
      if (q.type === 'multiple') {
        multiWrap.classList.remove('hidden');
      }
    }
  });

  function handleOptionClick(btn, type) {
    const i = Number(btn.dataset.i);
    if (type === 'multiple') {
      btn.classList.toggle('selected');
      selected = [...document.querySelectorAll('.opt-btn.selected')].map(b => Number(b.dataset.i));
    } else {
      // single / yesno: immediate submit on tap
      selected = [i];
      submitAnswer();
    }
  }

  document.getElementById('submitMultiBtn').onclick = () => {
    submitAnswer();
  };

  document.getElementById('submitTextBtn').onclick = () => {
    const val = document.getElementById('textAnswer').value.trim();
    submitAnswer(val);
  };

  function submitAnswer(textVal) {
    const answer = currentQuestion.type === 'text' ? (textVal || '') : selected;
    socket.emit('submit-answer', { gameId: myGameId, answer });
    lockOptions();
  }

  function lockOptions() {
    [...document.querySelectorAll('.opt-btn')].forEach(b => b.classList.add('disabled'));
    document.getElementById('submitTextBtn').disabled = true;
    document.getElementById('submitMultiBtn').disabled = true;
  }

  socket.on('answer-received', ({ correct, gained, total }) => {
    show('feedbackView');
    document.getElementById('feedbackText').textContent = correct ? '✅ Correct!' : '❌ Wrong';
    document.getElementById('scoreText').textContent = `+${gained} pts  •  total: ${total}`;
  });

  socket.on('reveal', () => {
    // if player never answered, still show feedback view with 0
    if (document.getElementById('questionView').classList.contains('hidden')) return;
    show('feedbackView');
    document.getElementById('feedbackText').textContent = '⏱ Time up';
    document.getElementById('scoreText').textContent = '';
  });

  socket.on('game-over', ({ leaderboard, winners }) => {
    show('endView');
    document.getElementById('winnersList').innerHTML = winners
      .map((w, i) => `<div class="winner">${i === 0 ? '🥇' : '🥈'} ${escapeHtml(w.nickname)} — ${w.score} pts</div>`).join('');
    document.getElementById('finalLbList').innerHTML = leaderboard
      .map(p => `<li><span>${escapeHtml(p.nickname)}</span><span>${p.score}</span></li>`).join('');
  });

  let timerInterval;
  function startTimer(seconds) {
    clearInterval(timerInterval);
    let remaining = seconds;
    const el = document.getElementById('timer');
    el.textContent = `⏱ ${remaining}s`;
    timerInterval = setInterval(() => {
      remaining -= 1;
      el.textContent = `⏱ ${Math.max(remaining, 0)}s`;
      if (remaining <= 0) clearInterval(timerInterval);
    }, 1000);
  }

  function show(id) {
    ['joinView','waitView','questionView','feedbackView','endView'].forEach(v =>
      document.getElementById(v).classList.toggle('hidden', v !== id));
  }
  function setErr(msg) { document.getElementById('joinErr').textContent = msg; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
